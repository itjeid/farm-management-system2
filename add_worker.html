{% extends "base.html" %}

{% block title %}
Add Worker
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    👷 Register Farm Worker
                </h2>


                <form method="POST">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Worker ID
                            </label>

                            <input
                                type="text"
                                name="worker_id"
                                class="form-control"
                                placeholder="e.g. LAB001"
                                required
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Job / Role
                            </label>

                            <input
                                type="text"
                                name="role"
                                class="form-control"
                                placeholder="e.g. Farm Worker"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Start Date
                            </label>

                            <input
                                type="date"
                                name="start_date"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Salary (RWF)
                            </label>

                            <input
                                type="number"
                                name="salary"
                                class="form-control"
                                min="0"
                                step="1"
                                value="0"
                            >

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                name="status"
                                class="form-select"
                            >

                                <option value="Active">
                                    Active
                                </option>

                                <option value="Inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Save Worker
                        </button>

                        <a
                            href="{{ url_for(
                                'labor.labor'
                            ) }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
