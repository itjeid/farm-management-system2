{% extends "base.html" %}

{% block title %}
Add Expense
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    💰 Add Farm Expense
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Feed">
                                Feed
                            </option>

                            <option value="Veterinary">
                                Veterinary
                            </option>

                            <option value="Medicine">
                                Medicine
                            </option>

                            <option value="Labor">
                                Labor
                            </option>

                            <option value="Equipment">
                                Equipment
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="3"
                            placeholder="Describe the expense..."
                        ></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Amount (RWF)
                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            min="1"
                            step="1"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            name="expense_date"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Save Expense
                    </button>

                    <a
                        href="{{ url_for(
                            'expenses.expenses'
                        ) }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
