{% extends "base.html" %}
{% block title %}Update Health Record | Farm Manager{% endblock %}
{% block content %}
<div class="form-shell"><div class="form-heading"><span class="eyebrow">ANIMAL HEALTH</span><h1>Update treatment & health</h1><p>Keep the animal's current condition and treatment progress up to date.</p></div>
<form method="POST" class="section-card p-4"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Animal *</label><select name="animal_id" class="form-select" required>{% for a in animals %}<option value="{{ a.id }}" {% if record.animal_id==a.id %}selected{% endif %}>{{ a.animal_id }} — {{ a.animal_type }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Record date *</label><input type="date" name="record_date" value="{{ record.record_date }}" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Current status *</label><select name="health_status" class="form-select" required>{% for s in ['Healthy','Sick','Under Treatment','Recovered','Vaccinated'] %}<option {% if record.health_status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Medicine used</label><input name="medicine_used" value="{{ record.medicine_used or '' }}" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Vaccination</label><input name="vaccination" value="{{ record.vaccination or '' }}" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Veterinarian</label><input name="veterinarian" value="{{ record.veterinarian or '' }}" class="form-control"></div>
<div class="col-12"><label class="form-label">Signs / symptoms</label><textarea name="signs" class="form-control" rows="4">{{ record.signs or '' }}</textarea></div>
<div class="col-12"><label class="form-label">Treatment notes / follow-up</label><textarea name="notes" class="form-control" rows="4">{{ record.notes or '' }}</textarea></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a href="{{ url_for('health.health') }}" class="btn btn-light">Cancel</a><button class="btn btn-success">Save health update</button></div></form></div>
{% endblock %}
