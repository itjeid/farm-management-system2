{% extends "base.html" %}

{% block title %}
Add Income
{% endblock %}


{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">
                        💰 Add Farm Income
                    </h4>

                </div>


                <div class="card-body">

                    <form
                        method="POST"
                        action="{{ url_for('finance.add_income') }}"
                    >

                        <!-- INCOME TYPE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Income Type
                            </label>

                            <select
                                name="income_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select income type
                                </option>

                                <option value="Milk">
                                    🥛 Milk
                                </option>

                                <option value="Eggs">
                                    🥚 Eggs
                                </option>

                                <option value="Crops">
                                    🌾 Crops
                                </option>

                                <option value="Manure">
                                    🌱 Manure
                                </option>

                                <option value="Livestock Products">
                                    🐄 Livestock Products
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="2"
                                placeholder="Describe the income"
                            ></textarea>

                        </div>


                        <!-- QUANTITY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                value="1"
                                required
                            >

                        </div>


                        <!-- UNIT PRICE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Unit Price (RWF)
                            </label>

                            <input
                                type="number"
                                name="unit_price"
                                class="form-control"
                                min="0"
                                step="1"
                                required
                            >

                        </div>


                        <!-- CUSTOMER -->

                        <div class="mb-3">

                            <label class="form-label">
                                Customer
                            </label>

                            <input
                                type="text"
                                name="customer"
                                class="form-control"
                                placeholder="Customer name"
                            >

                        </div>


                        <!-- DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Income Date
                            </label>

                            <input
                                type="date"
                                name="income_date"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- NOTES -->

                        <div class="mb-4">

                            <label class="form-label">
                                Notes
                            </label>

                            <textarea
                                name="notes"
                                class="form-control"
                                rows="3"
                                placeholder="Additional notes"
                            ></textarea>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                💾 Save Income
                            </button>


                            <a
                                href="{{ url_for('finance.finance') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
