{% extends "base.html" %}{% block title %}Register Cow | Farm Manager{% endblock %}{% block content %}<div class="form-shell"><div class="form-heading"><span class="eyebrow">LIVESTOCK</span><h1>Register a cow</h1><p>Only cattle are managed by this version. Existing database records are preserved.</p></div><form method="POST" class="section-card p-4"><input type="hidden" name="animal_type" value="Cow"><div class="row g-3"><div class="col-md-6"><label class="form-label">Cow ID *</label><input name="animal_id" class="form-control" required placeholder="e.g. COW-001"></div><div class="col-md-6"><label class="form-label">Breed</label><input name="breed" class="form-control" placeholder="e.g. Friesian"></div><div class="col-md-6"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">Select</option><option>Female</option><option>Male</option></select></div><div class="col-md-6"><label class="form-label">Date of birth</label><input type="date" name="date_of_birth" class="form-control"></div><div class="col-md-6"><label class="form-label">Current health status</label><select name="health_status" class="form-select"><option>Healthy</option><option>Sick</option><option>Under Treatment</option><option>Recovered</option><option>Vaccinated</option></select></div><div class="col-md-6"><label class="form-label">Purchase price (RWF)</label><input type="number" min="0" step="0.01" name="purchase_price" class="form-control"></div></div><div class="mt-4"><button class="btn btn-success">Register cow</button><a class="btn btn-light ms-2" href="{{ url_for('livestock.livestock') }}">Cancel</a></div></form></div>{% endblock %}
