{% extends "base.html" %}
{% block title %}Ledger Entry{% endblock %}
{% block content %}
<div class="page-header"><span class="eyebrow">ACCOUNTING</span><h1>Add Ledger Transaction</h1></div>
<div class="card modern-card"><div class="card-body p-4"><form method="POST"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Account</label><select name="account_id" class="form-select" required>{% for a in accounts %}<option value="{{ a.id }}">{{ a.name }} ({{ a.account_type }})</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Date</label><input type="date" name="entry_date" class="form-control" required></div>
<div class="col-12"><label class="form-label">Description</label><input name="description" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Debit</label><input type="number" name="debit" step="0.01" min="0" class="form-control" value="0"></div>
<div class="col-md-6"><label class="form-label">Credit</label><input type="number" name="credit" step="0.01" min="0" class="form-control" value="0"></div>
</div><button class="btn btn-success mt-4">Save Entry</button> <a href="{{ url_for('ledger.ledger') }}" class="btn btn-outline-secondary mt-4">Cancel</a></form></div></div>
{% endblock %}
